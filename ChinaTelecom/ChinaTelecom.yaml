name: 中国电信小组件（测试版）
description: 登录 e.189.cn 网页营业厅并查询套餐余量。
author: ChinaTelecom widget adaptation
scriptings:
  - generic:
      name: china-telecom
      script_url: https://raw.githubusercontent.com/Wyatt323/Egern/main/ChinaTelecom/ChinaTelecom_Widget.js
      update_interval: 21600
      timeout: 20
  - http_request:
      name: 电信营业厅登录信息捕获
      match: '^https://e\.189\.cn/store/user/(package_detail|balance_new)\.do(?:\?|$)'
      script_url: https://raw.githubusercontent.com/Wyatt323/Egern/main/ChinaTelecom/ChinaTelecom_Widget.js
      body_required: false
      timeout: 10
  - http_response:
      name: 电信营业厅余量解析
      match: '^https://e\.189\.cn/store/user/(package_detail|balance_new)\.do(?:\?|$)'
      script_url: https://raw.githubusercontent.com/Wyatt323/Egern/main/ChinaTelecom/ChinaTelecom_Widget.js
      body_required: true
      max_size: 1048576
      timeout: 10
mitm:
  hostnames:
    includes:
      - e.189.cn
widgets:
  - name: china-telecom
    script_name: china-telecom
